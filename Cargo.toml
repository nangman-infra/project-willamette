[package]
name = "project-willamette"
version = "0.11.0"
edition = "2021"
description = "Rust-native, mmap-backed CPU runtime for BitNet I2_S and classic Llama F16/Q4_0/Q8_0 GGUFs."
license = "MIT OR Apache-2.0"
readme = "README.md"
default-run = "project-willamette"

# Backend selection is `cfg`-based and runtime-dispatched:
#   * aarch64 uses NEON when detected.
#   * x86/x86_64 uses the SSE2 i8 kernel on SSSE3+ CPUs and the scalar LUT
#     kernel on SSE2-only CPUs; `willamette_sse2_f32` selects the f32 variant.
#   * Other targets, or targets without the required SIMD, use scalar fallback.

[dependencies]
memmap2 = "0.9"          # zero-copy file mapping
anyhow = "1.0"           # CLI error plumbing
thiserror = "1.0"        # typed errors in src/error.rs
clap = { version = "4", features = ["derive"] }
byteorder = "1.5"        # GGUF little-endian primitive reads
half = "2"               # IEEE f16 conversion for Q6_K artifact generation
regex = "1"              # byte-level BPE pre-tokenization
rayon = "1.10"           # Stage 10-C: BitLinear matvec row parallelism (ISA-neutral; M-series perf cores + multi-core SSE2/Pentium-4 friendly)
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
                         # Stage 9-E: TUI framework (re-exports crossterm).
                         # `unstable-rendered-line-info` (issue ratatui#293)
                         # exposes Paragraph::line_count, needed to compute
                         # max_scroll for sticky-to-bottom auto-scroll.
crossterm = "0.28"       # Stage 9-E: terminal raw mode + event polling
sysinfo = "0.32"         # v0.3.0: cross-platform CPU/memory polling for the dashboard pane
unicode-width = "0.2"    # v0.3.0: cell-width measurement for cursor placement (CJK / emoji)

[dev-dependencies]
sha2 = "0.10"            # pinned external-artifact checksum regression

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# Declared cfgs that are intentionally optional (not Cargo features).
unexpected_cfgs = { level = "warn", check-cfg = [
    "cfg(willamette_i8_activations)",
    "cfg(willamette_sse2_f32)",
    "cfg(willamette_lut)",
    "cfg(willamette_stage_timing)",
] }
